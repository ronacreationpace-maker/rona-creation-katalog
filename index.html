<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RONA CREATION - Katalog Produk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
<header class="header">

    <div class="brand">
        <img
            src="images/logo-rona.png"
            alt="Logo RONA CREATION"
        >

        <div class="brand-text">
            <div class="logo">
                RONA <span>CREATION</span>
            </div>

            <div class="tagline">
                Mahar • Undangan • Hantaran • Custom
            </div>
        </div>
    </div>

</header>

    <!-- HERO -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Temukan Produk<br>
                Favoritmu ✨
            </h1>

            <p>
                Temukan koleksi cantik RONA CREATION untuk melengkapi momen spesial Anda.
            </p>

        </div>

    </section>


    <!-- PENCARIAN -->
<section class="search-section">

    <input
        type="text"
        id="searchInput"
        placeholder="🔎 Cari produk..."
    >

    <button
        type="button"
        id="shareCatalogButton"
        class="share-catalog-button"
    >
        📤 Bagikan Katalog
    </button>

</section>


   <!-- KATEGORI -->
<section class="category-wrapper">

    <div class="section-label">
        📂 Pilih Kategori
    </div>

    <section class="category-section">

        <button class="category active">
            Semua
        </button>

        <button class="category">
            Mahar
        </button>

        <button class="category">
            Undangan
        </button>

        <button class="category">
            Hantaran
        </button>

        <button class="category">
            Pigura & Cetak Foto
        </button>

        <button class="category">
            Lainnya
        </button>

    </section>

</section>
    <!-- SUBKATEGORI -->
    

<div
    id="subcategoryFilter"
    class="subcategory-section">
</div>

<!-- URUTKAN PRODUK -->
<section class="sort-section">

    <label for="sortSelect">
        ↕️ Urutkan Menurut
    </label>

    <select id="sortSelect">

        <option value="terbaru">
            Terbaru
        </option>

        <option value="nama-az">
            Nama A–Z
        </option>

        <option value="nama-za">
            Nama Z–A
        </option>

        <option value="harga-rendah">
            Harga Termurah
        </option>

        <option value="harga-tinggi">
            Harga Termahal
        </option>

    </select>

</section>

   <!-- PRODUK -->
<main class="product-section">

    </div>

        <div
            id="productContainer"
            class="product-container"
        >

            <!-- Produk nanti muncul di sini -->

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <h3>RONA CREATION</h3>

        <p>
            Mahar • Undangan • Hantaran • Custom
        </p>

        <p class="copyright">
            © 2026 RONA CREATION
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>
</html>
